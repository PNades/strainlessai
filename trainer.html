<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pitch Trainer - Strainless AI</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="preload" href="/static/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/lora-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/trainer.css">
</head>
<body>

<header class="site-header header">
    <div class="site-header-inner">
        <a href="/" class="btn btn-secondary back-btn">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
            Back
        </a>
        <h1>Pitch Accuracy Trainer</h1>
    </div>
</header>

<main class="main-container">
    <!-- Setup Card -->
    <section class="card">
        <h2>Practice Settings</h2>

        <div class="settings-grid">
            <div class="setting-group">
                <label for="practiceRange">Vocal Range</label>
                <select id="practiceRange">
                    <option value="bass">Bass (F2-E4)</option>
                    <option value="tenor" selected>Tenor (C3-A4)</option>
                    <option value="alto">Alto (G3-E5)</option>
                    <option value="soprano">Soprano (C4-A5)</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty" onchange="setDifficulty()">
                    <option value="easy" selected>Easy (Natural notes)</option>
                    <option value="hard">Hard (All notes)</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary big" id="startSessionBtn" onclick="startSession()">
                Start Practice
            </button>
            <button class="btn btn-secondary big" id="stopSessionBtn" onclick="stopSession()" disabled>
                Stop Practice
            </button>
        </div>
    </section>

    <!-- Practice Area -->
    <div id="practiceArea">
        <!-- Target Note Display -->
        <section class="card">
            <div class="target-note-display">
                <div class="target-note-label">Sing This Note</div>
                <div id="targetNote">C4</div>
                <button class="btn btn-secondary play-note-btn" onclick="playTargetNote()">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
                    Play Note
                </button>
            </div>
        </section>

        <!-- Record Button -->
        <section class="card">
            <div class="action-buttons">
                <button id="recordBtn" class="btn btn-primary big">Hold to Sing</button>
                <button class="btn btn-secondary big" onclick="nextNote()">
                    Next Note
                </button>
            </div>

            <!-- Accuracy Feedback -->
            <div id="accuracyFeedback" role="status" aria-live="polite">
                <div id="feedbackIcon">🎯</div>
                <div id="feedbackText">Perfect pitch!</div>
            </div>
        </section>

        <!-- Pitch Meter -->
        <section class="card">
            <h2>Pitch Meter</h2>
            <div class="pitch-meter" aria-hidden="true">
                <div class="meter-gradient"></div>
                <div class="meter-center-line"></div>
                <div class="meter-needle" id="meterNeedle"></div>
            </div>
            <div class="meter-scale" aria-hidden="true">
                <span class="flat">Flat</span>
                <span class="center">On pitch</span>
                <span class="sharp">Sharp</span>
            </div>

            <div class="pitch-display">
                <div class="pitch-info">
                    <div class="pitch-info-label">Your Pitch</div>
                    <div class="pitch-info-value" id="detectedPitch">--</div>
                </div>
                <div class="pitch-info">
                    <div class="pitch-info-label">Accuracy</div>
                    <div class="pitch-info-value" id="pitchDiff" aria-live="polite">Click button and sing</div>
                </div>
            </div>
        </section>

        <!-- Stats -->
        <section class="card">
            <h2>Session Stats</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Notes Attempted</div>
                    <div class="stat-value" id="notesAttempted">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracy">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Current Streak</div>
                    <div class="stat-value" id="streak">0 🔥</div>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
// Pitch Accuracy Trainer JavaScript
// Uses Web Audio API with autocorrelation for pitch detection

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
let oscillator = null;
let mediaStream = null;
let analyser = null;
let scriptProcessor = null;
let isListening = false;
let isSessionActive = false;

// Session stats
let stats = {
    notesAttempted: 0,
    correctNotes: 0,
    streak: 0,
    currentLevel: 1
};

// Note frequencies - Extended range from C2 to C6
const noteFrequencies = {
    'C2': 65.41, 'C#2': 69.30, 'D2': 73.42, 'D#2': 77.78,
    'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00,
    'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47,
    'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56,
    'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00,
    'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
    'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
    'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
    'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
    'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25,
    'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99,
    'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
    'C6': 1046.50
};

let currentTargetNote = 'C4';
let currentTargetFreq = 261.63;
let detectedFreq = 0;
let detectedPitchHistory = [];
let skipReadings = 0;

// Start practice session
async function startSession() {
    isSessionActive = true;
    document.getElementById('startSessionBtn').disabled = true;
    document.getElementById('stopSessionBtn').disabled = false;
    document.getElementById('practiceArea').style.display = 'block';
    
    // Reset stats
    stats = { notesAttempted: 0, correctNotes: 0, streak: 0, currentLevel: 1 };
    updateStats();
    
    // Generate first note
    generateRandomNote();
    
    // Request microphone access
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            } 
        });
        await setupAudioAnalysis();
        console.log('✅ Microphone access granted');
    } catch (error) {
        alert('Microphone access required for pitch detection. Please allow microphone access and try again.');
        stopSession();
    }
}

// Stop session
function stopSession() {
    isSessionActive = false;
    isListening = false;
    
    document.getElementById('startSessionBtn').disabled = false;
    document.getElementById('stopSessionBtn').disabled = true;
    
    if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
    }
    
    if (analyser) {
        analyser.disconnect();
        analyser = null;
    }
    
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
    
    stopNote();
}

// Generate random note
function generateRandomNote() {
    const range = document.getElementById('practiceRange').value;
    let noteNames = [];
    
    if (range === 'bass') {
        // Bass: F2-E4
        noteNames = ['F2', 'G2', 'A2', 'B2', 
                     'C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3',
                     'C4', 'D4', 'E4'];
    } else if (range === 'tenor') {
        // Tenor: C3-A4
        noteNames = ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3',
                     'C4', 'D4', 'E4', 'F4', 'G4', 'A4'];
    } else if (range === 'alto') {
        // Alto: G3-E5
        noteNames = ['G3', 'A3', 'B3',
                     'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4',
                     'C5', 'D5', 'E5'];
    } else {
        // Soprano: C4-A5
        noteNames = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4',
                     'C5', 'D5', 'E5', 'F5', 'G5', 'A5'];
    }
    
    const difficulty = document.getElementById('difficulty').value;
    if (difficulty === 'easy') {
        noteNames = noteNames.filter(n => !n.includes('#'));
    }
    
    const randomNote = noteNames[Math.floor(Math.random() * noteNames.length)];
    currentTargetNote = randomNote;
    currentTargetFreq = noteFrequencies[randomNote];
    
    document.getElementById('targetNote').textContent = randomNote;
    document.getElementById('accuracyFeedback').style.display = 'none';
    document.getElementById('detectedPitch').textContent = '--';
    document.getElementById('pitchDiff').textContent = 'Click button and sing';
    
    // Reset meter
    document.getElementById('meterNeedle').style.left = '50%';
}

// Play target note
function playTargetNote() {
    playNote(currentTargetFreq, 2000);
}

// Play note
function playNote(frequency, duration = 2000) {
    stopNote();
    
    const osc = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    osc.type = 'sine';
    osc.frequency.value = frequency;
    
    osc.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
    gainNode.gain.linearRampToValueAtTime(1.2, audioContext.currentTime + 0.1);
    
    osc.start();
    oscillator = osc;
    
    setTimeout(() => {
        gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.1);
        setTimeout(() => stopNote(), 100);
    }, duration - 100);
}

function stopNote() {
    if (oscillator) {
        try {
            oscillator.stop();
        } catch (e) {}
        oscillator = null;
    }
}

// Setup audio analysis
async function setupAudioAnalysis() {
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    
    const source = audioContext.createMediaStreamSource(mediaStream);
    
    scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
    
    source.connect(analyser);
    analyser.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);
    
    scriptProcessor.onaudioprocess = function(event) {
        if (isListening) {
            detectPitch();
        }
    };
}

// McLeod Pitch Method using Normalized Square Difference Function (NSDF)
// More robust than difference function for complex timbres and lower notes
function autoCorrelate(buffer, sampleRate) {
    const size = buffer.length;
    const maxSamples = Math.floor(size / 2);

    let rms = 0;
    for (let i = 0; i < size; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / size);
    if (rms < 0.005) return -1;

    const minOffset = Math.floor(sampleRate / 2000);

    // Fixed energy of reference window (doesn't change with offset)
    let e1 = 0;
    for (let i = 0; i < maxSamples; i++) e1 += buffer[i] * buffer[i];

    // Sliding energy of lagged window, initialized at offset = minOffset
    let e2 = 0;
    for (let i = minOffset; i < minOffset + maxSamples; i++) e2 += buffer[i] * buffer[i];

    let bestOffset = -1;
    let bestVal = 0;
    let foundNegative = false;
    let foundPeak = false;

    for (let offset = minOffset; offset < maxSamples; offset++) {
        let acf = 0;
        for (let i = 0; i < maxSamples; i++) acf += buffer[i] * buffer[i + offset];

        // NSDF: r(τ) = 2·Σx[i]·x[i+τ] / (Σx[i]² + Σx[i+τ]²)
        // Properly goes negative at half-period, enabling reliable fundamental detection
        const nsdf = (e1 + e2) > 0 ? (2 * acf) / (e1 + e2) : 0;

        // Slide e2 window forward for next iteration
        e2 = e2 - buffer[offset] * buffer[offset]
                + buffer[offset + maxSamples] * buffer[offset + maxSamples];

        // Wait for first negative crossing before accepting any peak
        // This skips sub-period harmonic peaks and finds the fundamental
        if (!foundNegative && nsdf < 0) foundNegative = true;
        if (!foundNegative) continue;

        if (nsdf > 0.8) {
            foundPeak = true;
            if (nsdf > bestVal) { bestVal = nsdf; bestOffset = offset; }
        } else if (foundPeak) {
            break; // Past the first key maximum — that's our fundamental
        }
    }

    if (bestOffset > 0) return sampleRate / bestOffset;
    return -1;
}

// Detect pitch
function detectPitch() {
    if (!analyser) return;
    if (skipReadings > 0) { skipReadings--; return; }
    
    const bufferLength = analyser.fftSize;
    const buffer = new Float32Array(bufferLength);
    analyser.getFloatTimeDomainData(buffer);
    
    const pitch = autoCorrelate(buffer, audioContext.sampleRate);
    
    if (pitch > 0 && pitch > 50 && pitch < 2000) {
        detectedFreq = pitch;
        detectedPitchHistory.push(pitch);
        
        if (detectedPitchHistory.length > 10) {
            detectedPitchHistory.shift();
        }
        
        const sortedPitches = [...detectedPitchHistory].sort((a, b) => a - b);
        const medianPitch = sortedPitches[Math.floor(sortedPitches.length / 2)];
        
        updatePitchMeter(medianPitch);
    }
}

// Snap detected frequency to the octave closest to the target note
function snapToTargetOctave(freq, targetFreq) {
    while (freq * Math.sqrt(2) < targetFreq) freq *= 2;
    while (freq / Math.sqrt(2) > targetFreq) freq /= 2;
    return freq;
}

// Update pitch meter
function updatePitchMeter(freq) {
    freq = snapToTargetOctave(freq, currentTargetFreq);
    const cents = 1200 * Math.log2(freq / currentTargetFreq);
    
    const noteName = frequencyToNote(freq);
    document.getElementById('detectedPitch').textContent = noteName;
    
    const centsDiff = Math.round(cents);
    let diffText = '';
    if (Math.abs(centsDiff) < 5) {
        diffText = '🎯 Perfect!';
    } else if (centsDiff > 0) {
        diffText = `↑ ${centsDiff} cents sharp`;
    } else {
        diffText = `↓ ${Math.abs(centsDiff)} cents flat`;
    }
    document.getElementById('pitchDiff').textContent = diffText;
    
    const needlePosition = 50 + (cents / 50) * 50;
    const clampedPosition = Math.max(0, Math.min(100, needlePosition));
    document.getElementById('meterNeedle').style.left = `${clampedPosition}%`;
}

// Frequency to note
function frequencyToNote(freq) {
    const A4 = 440;
    const C0 = A4 * Math.pow(2, -4.75);
    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    
    const halfSteps = 12 * Math.log2(freq / C0);
    const roundedHalfSteps = Math.round(halfSteps);
    const octave = Math.floor(roundedHalfSteps / 12);
    const noteIndex = roundedHalfSteps % 12;
    
    return noteNames[noteIndex] + octave;
}

// Button handlers
document.addEventListener('DOMContentLoaded', function() {
    const recordBtn = document.getElementById('recordBtn');
    if (recordBtn) {
        recordBtn.addEventListener('mousedown', () => {
            if (isSessionActive && !isListening) {
                startListening();
            }
        });
        
        recordBtn.addEventListener('mouseup', () => {
            if (isListening) {
                stopListening();
            }
        });
        
        recordBtn.addEventListener('mouseleave', () => {
            if (isListening) {
                stopListening();
            }
        });
        
        recordBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isSessionActive && !isListening) {
                startListening();
            }
        });
        
        recordBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isListening) {
                stopListening();
            }
        });
    }
});

function startListening() {
    isListening = true;
    detectedPitchHistory = [];
    skipReadings = 3; // Discard first 3 callbacks — analyser buffer still holds stale audio
    const recordBtn = document.getElementById('recordBtn');
    recordBtn.textContent = 'Listening...';
    recordBtn.style.background = 'var(--accent-hover)';
}

function stopListening() {
    isListening = false;
    const recordBtn = document.getElementById('recordBtn');
    recordBtn.textContent = 'Hold to Sing';
    recordBtn.style.background = 'var(--accent)';
    
    if (detectedPitchHistory.length > 5) {
        evaluatePitch();
    } else {
        document.getElementById('pitchDiff').textContent = 'Sing louder or hold button longer';
    }
}

// Evaluate pitch
function evaluatePitch() {
    if (detectedPitchHistory.length === 0) {
        document.getElementById('pitchDiff').textContent = 'No pitch detected - try singing louder';
        return;
    }
    
    // Snap each reading to the target octave before taking the median.
    // Without this, a mix of C3 and C4 readings produces a median between octaves.
    const sortedPitches = detectedPitchHistory
        .map(p => snapToTargetOctave(p, currentTargetFreq))
        .sort((a, b) => a - b);
    const medianFreq = sortedPitches[Math.floor(sortedPitches.length / 2)];

    const cents = 1200 * Math.log2(medianFreq / currentTargetFreq);
    const absCents = Math.abs(cents);
    
    stats.notesAttempted++;
    
    let accuracy = 'off';
    let icon = '❌';
    let message = 'Keep practicing!';
    let color = 'var(--bad)';
    
    if (absCents <= 10) {
        accuracy = 'perfect';
        icon = '🎯';
        message = 'Perfect! Right on pitch!';
        color = 'var(--ok)';
        stats.correctNotes++;
        stats.streak++;
        
        if (stats.streak > 0 && stats.streak % 5 === 0) {
            stats.currentLevel++;
            message = `🎉 Level ${stats.currentLevel}! Perfect pitch!`;
        }
    } else if (absCents <= 25) {
        accuracy = 'close';
        icon = '✓';
        message = 'Good! Very close!';
        color = 'var(--warn)';
        stats.correctNotes++;
        stats.streak++;
    } else {
        accuracy = 'off';
        icon = '❌';
        const direction = cents > 0 ? 'sharp' : 'flat';
        message = `Too ${direction} - adjust ${cents > 0 ? 'down' : 'up'} slightly`;
        color = 'var(--bad)';
        stats.streak = 0;
    }
    
    document.getElementById('feedbackIcon').textContent = icon;
    document.getElementById('feedbackIcon').style.color = color;
    document.getElementById('feedbackText').textContent = message;
    document.getElementById('feedbackText').style.color = color;
    document.getElementById('accuracyFeedback').style.display = 'block';
    
    updateStats();
}

function nextNote() {
    generateRandomNote();
    document.getElementById('accuracyFeedback').style.display = 'none';
    detectedPitchHistory = [];
}

function setDifficulty() {
    const difficulty = document.getElementById('difficulty').value;
    console.log('Difficulty set to:', difficulty);
}

function updateStats() {
    document.getElementById('notesAttempted').textContent = stats.notesAttempted;
    
    const accuracy = stats.notesAttempted > 0 
        ? Math.round((stats.correctNotes / stats.notesAttempted) * 100) 
        : 0;
    document.getElementById('accuracy').textContent = `${accuracy}%`;
    
    document.getElementById('streak').textContent = `${stats.streak} 🔥`;
}
</script>

</body>
</html>
